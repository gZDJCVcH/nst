name: ci

# 只做代码检查与测试，不产出任何打包产物。
# 打包见 snapshot.yml（手动）和 release.yml（打 tag）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build ./...
        env:
          CGO_ENABLED: "0"

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 校验 Agent Skill 结构
        run: sh scripts/check-skill.sh
