version: 2

project_name: nst

before:
  hooks:
    - go mod tidy

builds:
  - id: nst
    main: ./cmd/nst
    binary: nst
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X nst/internal/buildinfo.Version={{ .Version }}
      - -X nst/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X nst/internal/buildinfo.Date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
      {{- with .Arm }}v{{ . }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - AGENTS.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github-native

release:
  draft: false
  prerelease: auto
  footer: |
    **安装**
    ```
    curl -fsSL https://raw.githubusercontent.com/gZDJCVcH/nst/main/install.sh | sh
    ```

